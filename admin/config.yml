backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

locale: nl

collections:

  - name: "instellingen"
    label: "Pagina-inhoud"
    files:

      - name: "homepage"
        label: "Homepage"
        file: "content/homepage.json"
        fields:
          - { label: "Hero titel regel 1", name: "hero_titel_1", widget: "string" }
          - { label: "Hero titel regel 2 (cyaan)", name: "hero_titel_2", widget: "string" }
          - { label: "Hero subtekst", name: "hero_subtekst", widget: "text" }
          - { label: "Hero foto slide 1", name: "hero_foto_1", widget: "image" }
          - { label: "Hero foto slide 2", name: "hero_foto_2", widget: "image" }
          - { label: "Hero foto slide 3", name: "hero_foto_3", widget: "image" }

      - name: "over"
        label: "Over Team Oxygen"
        file: "content/over.json"
        fields:
          - { label: "Foto Welmoet", name: "foto_welmoet", widget: "image" }
          - { label: "Intro alinea 1", name: "alinea_1", widget: "text" }
          - { label: "Intro alinea 2", name: "alinea_2", widget: "text" }
          - { label: "Intro alinea 3", name: "alinea_3", widget: "text" }

      - name: "pakketten"
        label: "Pakketten & prijzen"
        file: "content/pakketten.json"
        fields:
          - label: "Oxygen Core"
            name: "core"
            widget: "object"
            fields:
              - { label: "Prijs", name: "prijs", widget: "string" }
              - { label: "Prijsnoot", name: "prijsnoot", widget: "string" }
              - { label: "Omschrijving", name: "omschrijving", widget: "text" }
          - label: "Oxygen Sprint"
            name: "sprint"
            widget: "object"
            fields:
              - { label: "Prijs", name: "prijs", widget: "string" }
              - { label: "Prijsnoot", name: "prijsnoot", widget: "string" }
              - { label: "Omschrijving", name: "omschrijving", widget: "text" }
          - label: "Oxygen Bridge"
            name: "bridge"
            widget: "object"
            fields:
              - { label: "Prijs", name: "prijs", widget: "string" }
              - { label: "Prijsnoot", name: "prijsnoot", widget: "string" }
              - { label: "Omschrijving", name: "omschrijving", widget: "text" }

      - name: "contact"
        label: "Contactgegevens"
        file: "content/contact.json"
        fields:
          - { label: "E-mailadres", name: "email", widget: "string" }
          - { label: "Telefoonnummer", name: "telefoon", widget: "string" }
          - { label: "Calendly link", name: "calendly", widget: "string" }
          - { label: "LinkedIn URL", name: "linkedin", widget: "string" }

  - name: "artikelen"
    label: "Artikelen"
    folder: "content/artikelen"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Publicatiedatum", name: "date", widget: "datetime", format: "DD-MM-YYYY" }
      - { label: "Samenvatting", name: "samenvatting", widget: "text" }
      - { label: "Omslagfoto", name: "foto", widget: "image", required: false }
      - { label: "Categorie", name: "categorie", widget: "select", options: ["Marketing strategie", "AI & marketing", "PE & groei", "Employer branding", "Nieuws"] }
      - { label: "Inhoud", name: "body", widget: "markdown" }
